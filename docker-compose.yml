services:
  web:
    build:
      context: .
      target: deps
    working_dir: /app
    command: sh -c "pnpm install && pnpm dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      DATABASE_PATH: /app/data/farm.db
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - farm_node_modules:/app/node_modules
      - farm_data:/app/data

volumes:
  farm_node_modules:
  farm_data:
